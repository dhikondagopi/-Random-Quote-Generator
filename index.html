<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Random Quote Generator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="app">
    <div class="quote-card">
      <h1 class="title">💬 Random Quote Generator</h1>

      <div class="quote-box">
        <div class="loader" id="loader"></div>
        <p id="quote" class="fade"></p>
        <p id="author"></p>
      </div>

      <div class="buttons">
        <button id="new-quote" class="btn primary">New Quote</button>
        <button id="copy-quote" class="btn secondary">Copy</button>
        <button id="tweet-quote" class="btn twitter">Tweet</button>
      </div>
    </div>

    <footer>
      <p>Developed with ❤️ by <b>Dhikonda Gopi Naidu</b></p>
    </footer>
  </div>

  <script src="script.js"></script>
</body>
</html>
